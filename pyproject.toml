[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmeter-mcp"
version = "0.1.0"
description = "MCP server for LLM and agent run telemetry: cost, tokens, latency, and reliability observability from a local SQLite store"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aptica Solutions" }]
keywords = ["mcp", "llm", "agent", "observability", "telemetry", "cost", "fastmcp"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
runmeter-mcp = "server:mcp.run"

[project.urls]
Homepage = "https://github.com/Aptica-Solutions/a-mcp-runmeter"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
