name: Template Boundary Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary-check:
    name: Manifest and changed files must satisfy .templatefiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate manifest integrity
        run: python3 .claude/hooks/check-templatefiles.py --check-manifest

      - name: Validate changed files against .templatefiles
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | python3 .claude/hooks/check-templatefiles.py
